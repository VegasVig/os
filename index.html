<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Vegas OS · Controle de Ordens de Serviço</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('vegas_os_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="app"><div class="boot"><span class="spinner"></span><span class="boot__txt">Carregando…</span></div></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="assertive"></div>
  <div id="print-root" aria-hidden="true"></div>
  <noscript><p style="padding:2rem;color:#fff;background:#000">Ative o JavaScript para usar o sistema.</p></noscript>

  <!-- Endereço do servidor (Apps Script) -->
  <script src="js/config.js"></script>
  <script>
    // Link exclusivo da OS: ...?os=1001&t=CODIGO
    (function () {
      var q = new URLSearchParams(location.search);
      window.VG_BOOT = {
        baseUrl: location.origin + location.pathname,
        os: (q.get('os') || '').replace(/\D/g, ''),
        t: (q.get('t') || '').replace(/[^A-Za-z0-9]/g, '')
      };
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="assets/logo-embed.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/assinatura.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/clientes.js"></script>
  <script src="js/tecnicos.js"></script>
  <script src="js/os.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/relatorios.js"></script>
  <script src="js/configuracoes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
