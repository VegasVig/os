<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Vegas OS · Controle de Ordens de Serviço</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">

  <!-- Aplica o tema salvo antes da renderização (evita "piscar") -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('vegas_os_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- Toda a interface é montada pelos módulos em /js -->
  <div id="app" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="assertive"></div>
  <div id="print-root" aria-hidden="true"></div>

  <noscript>
    <p style="padding:2rem;color:#fff;background:#000">Ative o JavaScript para usar o sistema.</p>
  </noscript>

  <!-- Biblioteca de PDF (se estiver offline, o sistema usa a impressão do navegador como alternativa) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Núcleo -->
  <script src="js/utils.js"></script>
  <script src="assets/logo-embed.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>

  <!-- Componentes -->
  <script src="js/assinatura.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/pdf.js"></script>

  <!-- Telas -->
  <script src="js/dashboard.js"></script>
  <script src="js/clientes.js"></script>
  <script src="js/tecnicos.js"></script>
  <script src="js/os.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/relatorios.js"></script>
  <script src="js/configuracoes.js"></script>

  <!-- Inicialização e rotas -->
  <script src="js/app.js"></script>
</body>
</html>
